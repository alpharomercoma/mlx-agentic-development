line-length = 90
target-version = "py310"

# Task graders and oracles are standalone fixtures, not library code. Their import
# order is load-bearing: sys.path.insert(SOLUTION_DIR) must execute before
# `import solution`, and import sorting would hoist the import above it and break
# every grader. They are checked by running them, which is the real test.
# Agent-produced code and archived run artefacts are DATA, not source. Linting them
# is meaningless, and reformatting them would corrupt the record of what the agent
# actually wrote.
exclude = [
    "benchmark/results/**",
    "benchmark/results_invalid_pilot/**",
    "benchmark/results_prerepair/**",
    "benchmark/results_fixture_contaminated/**",
    "benchmark/docs-kit/**",
    "benchmark/facts-kit/**",
    "benchmark/tasks/*/test_solution.py",
    "benchmark/tasks/*/oracle/*.py",
    "benchmark/tasks/*/workspace/*.py",
]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
